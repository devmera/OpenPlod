name: Companion
options:
  bundleIdPrefix: com.openplod
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"        # generated UniFFI bindings predate Swift 6 strict concurrency
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The Rust core is built for Apple Silicon only (device and simulator).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Set your Apple team ID to install on an iPhone: DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  OpenPlodCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated/companion_ffi.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenPlod
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Woken in the background when the linked recorder advertises (CoreBluetooth state restoration).
        UIBackgroundModes: [bluetooth-central, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.openplod.companion.refresh]
        NSBluetoothAlwaysUsageDescription: >-
          OpenPlod connects to your Plaud recorder over Bluetooth to copy your recordings.
        NSLocationWhenInUseUsageDescription: >-
          OpenPlod uses your recorder's Bluetooth beacon to sync recordings in the background. Your location is never read or stored.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Allow “Always” so your recorder's Bluetooth beacon can wake OpenPlod to sync new recordings while the app is closed. Your location is never read or stored.
        NSCameraUsageDescription: >-
          OpenPlod reads the pairing QR code shown by OpenPlod on your Mac.
        NSLocalNetworkUsageDescription: >-
          OpenPlod contacts OpenPlod on your Mac once, to receive the recorder key.
        # OpenPlod on the Mac serves plain HTTP on the local network (or Tailscale), authenticated by
        # its pairing token; the recorder key itself travels end-to-end encrypted.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openplod.companion
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - framework: CompanionFFI.xcframework
        embed: false
      - sdk: CoreBluetooth.framework
      - sdk: Security.framework
      - sdk: VisionKit.framework
      - sdk: CoreLocation.framework
