name: Companion
options:
  bundleIdPrefix: com.openplod
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"        # generated UniFFI bindings predate Swift 6 strict concurrency
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The Rust core is built for Apple Silicon only (device and simulator).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Set your Apple team ID to install on an iPhone: DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  OpenPlodCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated/companion_ffi.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenPlod
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: >-
          OpenPlod connects to your Plaud recorder over Bluetooth to copy your recordings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openplod.companion
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - framework: CompanionFFI.xcframework
        embed: false
      - sdk: CoreBluetooth.framework
      - sdk: Security.framework
