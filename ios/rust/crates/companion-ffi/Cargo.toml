[package]
name = "companion-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Swift (UniFFI) bindings for the OpenPlod iOS companion: the Plaud protocol over a Bluetooth transport provided by Swift"

[lib]
name = "companion_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
plaud-protocol = { path = "../plaud-protocol" }
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
hex = "0.4"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uniffi = { version = "0.32.2", features = ["tokio"] }

[dev-dependencies]
chacha20 = "0.9"
chacha20poly1305 = "0.10"
rand = "0.8"
